<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Motion Markets — component proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --serif: "Instrument Serif", Georgia, serif;
    --sans: Inter, ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --paper: #0b0a08;
    --ink: #f4f1ea;
    --mut: #8a8378;
    --acc: #d7ff3e;
    --up: #5fbd85;
    --down: #ef7f6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans);
    background-image:
      radial-gradient(60% 40% at 15% 0%, rgba(215,255,62,.07), transparent 70%),
      radial-gradient(50% 35% at 90% 20%, rgba(120,180,255,.06), transparent 70%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 56px 28px 120px; }
  .hd { margin-bottom: 46px; }
  .hd .eyebrow {
    font: 600 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase;
    color: var(--mut); display: block; margin-bottom: 14px;
  }
  .hd h1 { font: 400 46px/1.05 var(--serif); margin: 0 0 12px; letter-spacing: -.02em; }
  .hd p { color: var(--mut); margin: 0; max-width: 62ch; line-height: 1.6; font-size: 14px; }
  .blk { margin-bottom: 62px; }
  .blk > .cap {
    display: flex; align-items: baseline; gap: 12px;
    font: 600 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--mut); margin-bottom: 16px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .blk > .cap b { color: var(--acc); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .stage {
    border-radius: 18px; padding: 30px;
    background: linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
    border: 1px solid rgba(255,255,255,.07);
  }
  .stage.dark { background: #0b0a08; }
  .ph { color: var(--mut); font: 500 11px/1 var(--mono); letter-spacing: .1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <span class="eyebrow">component proof · motion markets</span>
    <h1>Framer components, ported</h1>
    <p>Each block below renders the real ported component with live-shaped data. Click the share icons, hover the glass, click a collapsed strip, tear a stub.</p>
  </div>
  <div id="root"></div>
</div>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>

<link rel="stylesheet" href="src/components/social-share.css" />
<link rel="stylesheet" href="src/components/liquid-glass.css" />
<link rel="stylesheet" href="src/components/expanded-card.css" />
<link rel="stylesheet" href="src/components/tear-ticket.css" />
<link rel="stylesheet" href="src/components/crest-gallery.css" />

<script type="module" src="harness.js"></script>
</body>
</html>
